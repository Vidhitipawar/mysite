<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Multi-Section Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        nav {
            background: #333;
            color: white;
            padding: 1rem;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 1rem;
            display: block;
        }

        nav a:hover {
            background: #555;
        }

        section {
            padding: 100px 20px 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #home {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #about {
            background: #f4f4f4;
        }

        #services {
            background: white;
        }

        #contact {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

      
      
    </style>
</head>
<body>
   
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

  
    <section id="home">
        <div class="container">
            <h1>Welcome</h1>
            <p>Simple multi-section page.</p>
        </div>
    </section>

    <!-- About Section -->
    <section id="about">
        <div class="container">
            <h2>About Us</h2>
            <p>This is a about section of simple single-page website.</p>
            
        </div>
    </section>

    <!-- Services Section -->
    <section id="services">
        <div class="container">
            <h2>Our Services</h2>
            <ul style="list-style: none; padding: 2rem 0;">
                <li style="margin: 1rem 0; font-size: 1.2rem;">✅ Web Design</li>
                <li style="margin: 1rem 0; font-size: 1.2rem;">✅ Development</li>
                <li style="margin: 1rem 0; font-size: 1.2rem;">✅ SEO</li>
            </ul>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <div class="container">
            <h2>Get In Touch</h2>
            <p>Ready to start your project? Contact us today!</p>
            <p><strong>email@example.com</strong></p>
        </div>
    </section>
</body>
</html>
